<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Published Sites</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: #666;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      max-width: 700px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1.5rem 2rem;
      text-decoration: none;
      color: inherit;
      width: 280px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
      transform: translateY(-3px);
    }
    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 0.4rem;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Published Sites</h1>
  <p class="subtitle">選擇一個報告頁面查看</p>
  <div class="cards">
    <a class="card" href="andes_analysis.html">
      <div class="card-label">Analysis</div>
      <div class="card-title">Andes Analysis</div>
    </a>
    <a class="card" href="foxwell_report.html">
      <div class="card-label">Report</div>
      <div class="card-title">Foxwell Report</div>
    </a>
  </div>
  <footer>Published Sites &mdash; 2026</footer>
</body>
</html>
